# ===================================================
# application-test.yml  — 测试环境配置
# ===================================================
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/flash_trade_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:flashtrade}
    password: ${DB_PASSWORD:flashtrade123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration,classpath:db/seed
    clean-on-validation-error: true

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-key-for-testing-only-not-for-production}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000

logging:
  level:
    com.tradex.flashtrade: INFO
    org.flywaydb: INFO
