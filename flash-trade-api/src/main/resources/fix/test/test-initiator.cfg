# FIX Gateway テスト用 Initiator 設定
# テストサーバー（FixTestAcceptor port 9876）への接続設定

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=10
HeartBtInt=30
FileStorePath=data/fix/test
FileLogPath=logs/fix/test
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=N
ResetOnLogon=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.2
SenderCompID=FLASHTRADE
TargetCompID=TEST_SERVER
SocketConnectHost=localhost
SocketConnectPort=9876
DataDictionary=FIX42.xml
