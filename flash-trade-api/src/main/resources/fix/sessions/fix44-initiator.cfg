# FIX 4.4 Initiator 設定（本番/UAT ブローカー接続用テンプレート）

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=30
HeartBtInt=30
FileStorePath=data/fix/sessions
FileLogPath=logs/fix/sessions
StartTime=09:00:00
EndTime=17:00:00
UseDataDictionary=Y
DataDictionary=FIX44.xml
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=Y
ResetOnLogon=N

[SESSION]
BeginString=FIX.4.4
SenderCompID=FLASHTRADE_PROD
TargetCompID=BROKER_B
SocketConnectHost=fix.broker-b.example.com
SocketConnectPort=9879
SocketUseSSL=Y
Username=your_username
Password=your_password
