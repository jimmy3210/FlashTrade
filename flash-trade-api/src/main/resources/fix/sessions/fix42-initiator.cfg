# FIX 4.2 Initiator 設定（本番/UAT ブローカー接続用テンプレート）
# 実際のブローカー接続時は以下の項目を環境変数または Secrets Manager から設定する:
#   - SocketConnectHost: ブローカーの FIX サーバーホスト
#   - SocketConnectPort: ブローカーの FIX サーバーポート
#   - SenderCompID: ブローカーから割り当てられた CompID
#   - TargetCompID: ブローカーの CompID

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=30
HeartBtInt=30
FileStorePath=data/fix/sessions
FileLogPath=logs/fix/sessions
StartTime=09:00:00
EndTime=17:00:00
UseDataDictionary=Y
DataDictionary=FIX42.xml
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=Y
ResetOnLogon=N
ResetOnDisconnect=N

[SESSION]
BeginString=FIX.4.2
SenderCompID=FLASHTRADE_PROD
TargetCompID=BROKER_A
SocketConnectHost=fix.broker-a.example.com
SocketConnectPort=9878
SocketUseSSL=Y
Username=your_username
Password=your_password
