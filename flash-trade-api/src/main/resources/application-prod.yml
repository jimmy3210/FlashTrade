# ===================================================
# application-prod.yml  — 生产环境配置
# 所有敏感信息通过环境变量注入，不在代码中硬编码
# ===================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/flash_trade_prod?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    baseline-on-migrate: false   # 生产环境必须为 false，防止覆盖已有数据库
    out-of-order: false          # 强制按顺序执行迁移脚本
    validate-on-migrate: true

app:
  security:
    web-auth:
      refresh-cookie-secure: true
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  # 嘉信证券（Charles Schwab）配置
  schwab:
    client-id: ${SCHWAB_CLIENT_ID}
    client-secret: ${SCHWAB_CLIENT_SECRET}
    redirect-uri: ${SCHWAB_REDIRECT_URI}
    base-url: https://api.schwabapi.com/trader/v1
    token-url: https://api.schwabapi.com/v1/oauth/token
    token-cache-key-prefix: schwab:oauth:token
    token-refresh-threshold-seconds: 120
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

logging:
  level:
    com.tradex.flashtrade: WARN
    root: ERROR
